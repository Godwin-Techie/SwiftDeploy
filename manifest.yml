mode: stable
network:
  driver_type: bridge
  name: swiftdeploy-net
nginx:
  image: nginx:latest
  port: 8080
  routes:
  - path: /
    port: 3000
    service: services
policy:
  canary:
    max_error_rate: 0.01
    max_p99_latency_ms: 500
  infrastructure:
    max_cpu_load: 2.0
    min_disk_gb: 10
services:
  env:
    LOG_LEVEL: info
    NODE_ENV: production
  image: swift-deploy-1-node:latest
  port: 3000
  volumes:
  - ./data:/app/data
